name: java-workflow-orchestrator CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Assumes this project is the repository root. If it lives in a monorepo subfolder,
    # move this file to the repo-root .github/workflows and add `defaults.run.working-directory`.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend build
        run: cd frontend && npm ci && npm run build
      - name: Unit + Testcontainers integration tests
        run: ./mvnw -B verify
      - name: Docker image builds
        run: docker build -t workflow-orchestrator .
